name: Update README with Recent Activity

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta todos los días a medianoche UTC
  workflow_dispatch: # Permite ejecutar el workflow manualmente

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update README with Recent Activity
        uses: JamesIves/github-readme-linkedin-recent-activity@v1.4.1 # Usamos esta acción
        with:
          GH_USERNAME: 'JesusAraujoDEV' # Tu nombre de usuario de GitHub
          COMMIT_MESSAGE: 'Update README with latest GitHub activity'
          MAX_LINES: '10' # Número máximo de líneas de actividad a mostrar (ajusta si quieres más o menos)
          # No se necesita GITHUB_TOKEN explícitamente si solo lees actividades públicas
          # y no manipulas repositorios privados con la acción.
          # Si en el futuro agregas LinkedIn, necesitarás configurar LKD_ACCESS_TOKEN como un secreto.
    
      - name: Push Changes
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add README.md
          git commit -m "Automated: Update recent activity" || echo "No changes to commit"
          git push || echo "No changes to push"
